<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin Login - LawConnect">
  <meta name="keywords" content="LawConnect, admin login">
  <meta name="author" content="LawConnect Team">
  <title>Admin Login | LawConnect</title>
  <link rel="stylesheet" href="loginPage.css" />
  <style>
    body {
      background: linear-gradient(135deg, #002f5c 0%, #1a365d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="login-container">
    <section class="login-box">
      <h1 class="welcome-text">ADMIN ACCESS</h1>
      <img src="images/lawconnect.jpg" alt="LawConnect Logo" class="gavel-icon" />

      <form id="adminLoginForm" class="login-form">
        <label for="adminEmail">ADMIN EMAIL:</label>
        <input type="email" id="adminEmail" name="email" required autocomplete="email" />

        <label for="adminPassword">ADMIN PASSWORD:</label>
        <input type="password" id="adminPassword" name="password" required autocomplete="current-password" />

        <button type="submit" class="login-btn">ADMIN LOGIN</button>
      </form>

      <footer class="brand-name">LAWCONNECT ADMIN</footer>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="admin-login.js"></script>
</body>
</html>
