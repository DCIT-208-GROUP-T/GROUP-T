<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Invoice | LawConnect</title>
    <style>
        :root {
            --primary-bg: #002f5c;
            --secondary-bg: #0a3c78;
            --card-bg: #fff;
            --light-grey-bg: #f8f9fa;
            --text-color-dark: #2d3748;
            --text-color-light: #fff;
            --primary-text-color: #002f5c;
            --accent-color: #1a00ff;
            --success-color: #38a169;
            --warning-color: #d69e2e;
            --error-color: #e53e3e;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-bg);
            color: var(--text-color-dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        .payment-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .payment-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .payment-header h1 {
            color: var(--primary-text-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .payment-header p {
            color: var(--text-color-dark);
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-text-color);
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(26, 0, 255, 0.1);
        }

        .invoice-summary {
            background: var(--light-grey-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--primary-text-color);
        }

        .card-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card-details.full-width {
            grid-template-columns: 1fr;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: #0000e6;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--light-grey-bg);
            color: var(--primary-text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .success-message {
            display: none;
            background: var(--success-color);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }

        .error-message {
            background: var(--error-color);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .payment-method {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .payment-method:hover {
            border-color: var(--accent-color);
        }

        .payment-method.selected {
            border-color: var(--accent-color);
            background: rgba(26, 0, 255, 0.05);
        }

        .payment-method-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .payment-card {
                padding: 20px;
            }

            .card-details {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="payment-card">
            <div class="payment-header">
                <h1>Pay Invoice</h1>
                <p>Securely pay your outstanding invoices online.</p>
            </div>

            <div id="error-message" class="error-message"></div>

            <form id="payment-form">
                <div class="form-group">
                    <label for="invoice-select">Select Invoice</label>
                    <select id="invoice-select" name="invoice" required>
                        <option value="">Choose an invoice</option>
                        <option value="INV-001">INV-001 - Legal Consultation ($150.00)</option>
                        <option value="INV-002">INV-002 - Document Review ($250.00)</option>
                        <option value="INV-003">INV-003 - Court Filing ($300.00)</option>
                    </select>
                </div>

                <div class="invoice-summary" id="invoice-summary" style="display: none;">
                    <div class="summary-row">
                        <span>Invoice:</span>
                        <span id="summary-invoice"></span>
                    </div>
                    <div class="summary-row">
                        <span>Description:</span>
                        <span id="summary-description"></span>
                    </div>
                    <div class="summary-row">
                        <span>Amount Due:</span>
                        <span id="summary-amount"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Payment Method</label>
                    <div class="payment-methods">
                        <div class="payment-method selected" data-method="card">
                            <div class="payment-method-icon">💳</div>
                            <div>Credit Card</div>
                        </div>
                        <div class="payment-method" data-method="paypal">
                            <div class="payment-method-icon">🅿️</div>
                            <div>PayPal</div>
                        </div>
                        <div class="payment-method" data-method="bank">
                            <div class="payment-method-icon">🏦</div>
                            <div>Bank Transfer</div>
                        </div>
                    </div>
                </div>

                <div id="card-details" class="card-details-section">
                    <div class="form-group">
                        <label for="card-number">Card Number</label>
                        <input type="text" id="card-number" name="cardNumber" placeholder="1234 5678 9012 3456" required>
                    </div>

                    <div class="card-details">
                        <div class="form-group">
                            <label for="expiry">Expiry Date</label>
                            <input type="text" id="expiry" name="expiry" placeholder="MM/YY" required>
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" name="cvv" placeholder="123" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="card-name">Name on Card</label>
                        <input type="text" id="card-name" name="cardName" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='ClientDashboard.html'">Back to Dashboard</button>
                    <button type="submit" class="btn btn-primary">Pay Invoice</button>
                </div>
            </form>

            <div id="success-message" class="success-message">
                <h3>Payment Successful!</h3>
                <p>Your payment has been processed successfully. You will receive a confirmation email shortly.</p>
                <button class="btn btn-secondary" onclick="window.location.href='ClientDashboard.html'" style="margin-top: 15px;">Return to Dashboard</button>
            </div>
        </div>
    </div>

    <script>
        // Invoice data
        const invoices = {
            'INV-001': { description: 'Legal Consultation', amount: 150.00 },
            'INV-002': { description: 'Document Review', amount: 250.00 },
            'INV-003': { description: 'Court Filing', amount: 300.00 }
        };

        let selectedPaymentMethod = 'card';

        // Invoice selection
        document.getElementById('invoice-select').addEventListener('change', function() {
            const invoiceId = this.value;
            const summary = document.getElementById('invoice-summary');

            if (invoiceId && invoices[invoiceId]) {
                const invoice = invoices[invoiceId];
                document.getElementById('summary-invoice').textContent = invoiceId;
                document.getElementById('summary-description').textContent = invoice.description;
                document.getElementById('summary-amount').textContent = `$${invoice.amount.toFixed(2)}`;
                summary.style.display = 'block';
            } else {
                summary.style.display = 'none';
            }
        });

        // Payment method selection
        document.querySelectorAll('.payment-method').forEach(method => {
            method.addEventListener('click', function() {
                document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
                this.classList.add('selected');
                selectedPaymentMethod = this.dataset.method;

                const cardDetails = document.getElementById('card-details');
                if (selectedPaymentMethod === 'card') {
                    cardDetails.style.display = 'block';
                } else {
                    cardDetails.style.display = 'none';
                }
            });
        });

        // Form submission
        document.getElementById('payment-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const invoiceSelect = document.getElementById('invoice-select');
            const invoiceId = invoiceSelect.value;

            if (!invoiceId) {
                showError('Please select an invoice to pay.');
                return;
            }

            // Validate card details if credit card
            if (selectedPaymentMethod === 'card') {
                const cardNumber = document.getElementById('card-number').value.trim();
                const expiry = document.getElementById('expiry').value.trim();
                const cvv = document.getElementById('cvv').value.trim();
                const cardName = document.getElementById('card-name').value.trim();

                if (!cardNumber || !expiry || !cvv || !cardName) {
                    showError('Please fill in all card details.');
                    return;
                }

                // Basic card number validation
                if (!/^\d{4}\s?\d{4}\s?\d{4}\s?\d{4}$/.test(cardNumber.replace(/\s/g, ''))) {
                    showError('Please enter a valid card number.');
                    return;
                }
            }

            // Hide error, show loading
            hideError();
            const submitBtn = this.querySelector('.btn-primary');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Processing Payment...';
            submitBtn.disabled = true;

            try {
                // Simulate payment processing
                await simulatePayment({
                    invoiceId,
                    paymentMethod: selectedPaymentMethod,
                    amount: invoices[invoiceId].amount
                });

                // Show success
                document.getElementById('payment-form').style.display = 'none';
                document.getElementById('success-message').style.display = 'block';

            } catch (error) {
                showError('Payment failed. Please try again.');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        // Simulate payment processing
        function simulatePayment(data) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log('Payment processed:', data);
                    resolve();
                }, 2000);
            });
        }
    </script>
</body>
</html>
